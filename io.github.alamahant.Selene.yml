app-id: io.github.alamahant.Selene
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: Selene

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-download:ro # Needed for easy access to downloaded contact files from peers.
  - --filesystem=xdg-documents/Selene:create

modules:
  - name: Selene
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DFLATHUB_BUILD=ON
      - -DBUILD_CURL=OFF
    sources:
      # libevent source code
      - type: git
        url: https://github.com/libevent/libevent.git
        tag: release-2.1.13-stable
        commit: 79ddfb460847999b807cba76d04e73891f29c6ee
        dest: libevent_src
      # tor source code
      - type: git
        url: https://gitlab.torproject.org/tpo/core/tor.git
        tag: tor-0.4.9.15
        commit: 4d8efff53a86670bcda1847b5ab28d2701e6034f
        dest: tor_src
      # Main application source
      - type: git
        url: https://github.com/alamahant/Selene.git
        tag: v1.1.2
        commit: 8a2eca27cc2520947d56e5cb0591940f50596e83

    cleanup:
      - /include
      - /lib/*.a
      - /share/doc
      - /share/man
      - /lib/cmake
      - /lib/pkgconfig

